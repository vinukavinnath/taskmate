name: TaskMate CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.7.0

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: List APK Directory
        run: ls -la build/app/outputs/flutter-apk/

      - name: Set Timestamp
        id: set_timestamp
        run: echo "TIMESTAMP=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      - name: Rename APK with Timestamp
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/taskmate-${{ steps.set_timestamp.outputs.timestamp }}.apk

      - name: List APK Directory after renaming
        run: ls -la build/app/outputs/flutter-apk/

      - name: Generate Dynamic Release Notes
        id: generate_release_notes
        run: |
          COMMITS=$(git log --pretty=format:"%h - %s" -n 5)
          {
            echo "Release notes for taskmate-${{ steps.set_timestamp.outputs.timestamp }} version"
            echo "### Recent Changes:"
            echo "$COMMITS"
          } >> release_notes.txt
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT


      - name: Upload artifact to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.TASKMATE_ANDROID_FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.TASKMATE_SERVICE_CREDENTIAL }}
          groups: taskmate-beta-testers
          file: build/app/outputs/flutter-apk/taskmate-${{ steps.set_timestamp.outputs.timestamp }}.apk
          releaseNotes: ${{ steps.generate_release_notes.outputs.release_notes }}
