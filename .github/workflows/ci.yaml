name: TaskMate CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clones repository
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.7.0

      - name: Install Dependencies
        run: flutter pub get

#      - name: Run Tests
#        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: List APK Directory
        run: ls -la build/app/outputs/flutter-apk/

      - name: Rename APK with Timestamp
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo $TIMESTAMP
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/taskmate-$TIMESTAMP.apk

      - name: List APK Directory after renaming
        run: ls -la build/app/outputs/flutter-apk/

      - name: Upload artifact to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{secrets.TASKMATE_ANDROID_FIREBASE_APP_ID}}
#         token: ${{secrets.FIREBASE_TOKEN}} This approach will be deprecated soon
#         Therefore I moved to service account approach
          serviceCredentialsFileContent: ${{ secrets.TASKMATE_SERVICE_CREDENTIAL}}
          groups: testers
          file: build/app/outputs/flutter-apk/taskmate-$TIMESTAMP.apk

